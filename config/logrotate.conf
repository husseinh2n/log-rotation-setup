# Target the specific log file generated by our application
/var/log/myapp/app.log {
    # Rotate log files daily
    daily
    
    # Keep 7 days worth of backrotated log files
    rotate 7
    
    # Compress the rotated log files using gzip to save space
    compress
    
    # Delay compression until the next rotation cycle so active processes don't write to a gzipped file
    delaycompress
    
    # Do not rotate the log if it is empty
    notifempty
    
    # If the log file is missing, go on to the next one without issuing an error
    missingok
    
    # Create a new log file with specific permissions (rw-r-----), owner (root), and group (adm)
    create 0640 root adm
}